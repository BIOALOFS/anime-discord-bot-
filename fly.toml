# Discord gateway bot: a background worker, not a web service.
# No [http_service] on purpose: the bot opens no port, and Fly would otherwise
# health-fail and auto-stop the machine. Keep exactly one machine (see README).

app = 'anpot'
primary_region = 'iad'

[build]

[env]
  DATABASE_URL = 'sqlite:///data/bot.db?mode=rwc'
  LOG_LEVEL = 'info'

[mounts]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
